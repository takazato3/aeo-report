name: Weekly Content Autopilot

on:
  schedule:
    # 毎週月曜 6:00 JST (= 日曜 21:00 UTC)
    - cron: '0 21 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  weekly-content:
    runs-on: ubuntu-latest
    env:
      # Opus等の高額モデルへの意図しない切り替わりを防ぐため固定。
      # 変更する場合はこの値だけ書き換えれば、PR本文の記録にも自動反映される。
      CLAUDE_MODEL: sonnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install -r requirements.txt

      - name: Fetch GSC/GA4 metrics
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python scripts/fetch_metrics.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create working branch
        id: branch
        run: |
          BRANCH="autopilot/$(date +%Y-%m-%d)"
          git checkout -B "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/prompts/weekly.md)" --model "$CLAUDE_MODEL" --dangerously-skip-permissions

      - name: Build site
        run: python build.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "content-autopilot[bot]"
          git config user.email "content-autopilot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "[Autopilot] ${{ steps.branch.outputs.branch }} 週次コンテンツ更新"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.commit.outputs.changed == 'true'
        run: git push origin "${{ steps.branch.outputs.branch }}" --force-with-lease

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          gh pr create \
            --title "[Autopilot] ${DATE} 週次コンテンツ更新" \
            --label autopilot \
            --body "## 概要
          週次のGSC/GA4データ分析（\`data/metrics/latest.md\`）に基づく自動コンテンツ更新です。

          実施内容の詳細は \`data/metrics/latest.md\` 末尾の「## 今週の実施アクション」を参照してください。

          ## 実行モデル
          \`${CLAUDE_MODEL}\`（コスト予測性のため固定。変更は \`.github/workflows/weekly-content.yml\` の \`env.CLAUDE_MODEL\`）

          ## 自動マージについて
          48時間後に自動マージされます。止める場合はholdラベルを付けてください。"

      - name: No changes
        if: steps.commit.outputs.changed == 'false'
        run: echo "今週は変更がありませんでした（アクションなし、または差分なし）。"

      - name: SNS post reminder
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          X_COUNT=0
          if [ -f sns/x-queue.md ]; then
            X_COUNT=$(grep -c '^\s*- \[ \]' sns/x-queue.md || true)
          fi

          NOTE_COUNT=0
          if [ -d sns/note-drafts ]; then
            NOTE_COUNT=$(find sns/note-drafts -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')
          fi

          TOTAL=$((X_COUNT + NOTE_COUNT))
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --label sns-reminder --state open \
            --json number --jq '.[0].number // empty')

          if [ "$TOTAL" -gt 0 ]; then
            TITLE="📮 SNS投稿キュー:X投稿${X_COUNT}件・note${NOTE_COUNT}件が待機中"
            BODY="## 未投稿コンテンツ

          - X投稿: ${X_COUNT}件
          - note記事: ${NOTE_COUNT}件

          ## リンク

          - X投稿キュー: ${REPO_URL}/blob/main/sns/x-queue.md
          - noteドラフト: ${REPO_URL}/tree/main/sns/note-drafts

          ## 使い方

          1. 上記リンクからドラフトを開き、内容を確認する
          2. 良ければそのままX/noteに投稿する
          3. 投稿したら sns/x-queue.md の該当行の \`[ ]\` を \`[x]\` に変更してコミットする
             （\`[x]\`の項目は次回の週次実行時に sns/x-posted.md へ自動でアーカイブされます）

          このIssueは未投稿件数に応じて自動的に更新・クローズされます。"

            gh label create sns-reminder --color FBCA04 \
              --description "SNS投稿の未処理ドラフトがあることを知らせるリマインド" 2>/dev/null || true

            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue edit "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
              echo "既存Issue #$EXISTING_ISSUE を更新しました。"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" \
                --label sns-reminder --assignee takazato3
              echo "新規Issueを作成しました。"
            fi
          else
            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue close "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" \
                --comment "未投稿のSNSコンテンツが0件になったため、このIssueをクローズします。"
              echo "Issue #$EXISTING_ISSUE をクローズしました。"
            else
              echo "未投稿は0件で、オープン中のリマインドIssueもありません。"
            fi
          fi
