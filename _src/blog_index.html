  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    :root {
      --navy-950: #061426;
      --navy-900: #081b33;
      --navy-800: #102a4a;
      --blue-gray-50: #f4f7fb;
      --blue-gray-100: #eaf0f7;
      --off-white: #fbfaf6;
      --white: #ffffff;
      --amber-400: #fbbf24;
      --amber-500: #f59e0b;
      --text-dark: #132033;
      --text-muted: #5f6f85;
      --border: #dce4ef;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', "Hiragino Sans", "Hiragino Kaku Gothic ProN",
        Arial, Meiryo, sans-serif;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-dark);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    .header {
      background: #0d2340;
      height: auto;
      padding: 1.5rem 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-img { height: 56px; width: auto; display: block; }
    .nav-logo-text { flex-direction: column; gap: 2px; }
    .nav-logo-name { font-size: 17px; font-weight: 700; color: var(--off-white); letter-spacing: 0.02em; white-space: nowrap; }
    .nav-logo-sub { font-size: 11px; color: rgba(251,250,246,0.55); white-space: nowrap; }
    .header-nav { display: flex; align-items: center; gap: 24px; }
    .header-nav a { font-size: 14px; color: rgba(251,250,246,0.75); text-decoration: none; transition: color 0.15s; white-space: nowrap; }
    .header-nav a:hover { color: var(--off-white); }
    .btn-nav-cta {
      background: var(--amber-400);
      color: var(--text-dark) !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      padding: 7px 14px;
      border-radius: 6px;
      transition: background 0.15s !important;
      white-space: nowrap;
    }
    .btn-nav-cta:hover { background: var(--amber-500) !important; }
    .nav-cta-tax { font-size: 0.8em; }
    .nav-cta-short { display: none; }

    @media (max-width: 768px) {
      .header-nav { gap: 14px; }
      .header-nav .nav-link-hide { display: none; }
      .nav-cta-full  { display: none; }
      .nav-cta-short { display: inline; }
    }
    @media (max-width: 480px) {
      .header-nav { gap: 10px; }
    }

    /* ─── Breadcrumb ─── */
    .breadcrumb {
      background: var(--navy-900);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
    }
    .breadcrumb a { color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.15s; }
    .breadcrumb a:hover { color: rgba(255,255,255,0.85); }
    .breadcrumb .sep { color: rgba(255,255,255,0.25); }
    .breadcrumb .current { color: rgba(255,255,255,0.75); }

    /* ─── Page Hero ─── */
    .page-hero {
      background: linear-gradient(160deg, var(--navy-900) 0%, var(--navy-800) 100%);
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 60% at 50% 0%, rgba(251,191,36,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .page-hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(251,191,36,0.15);
      border: 1px solid rgba(251,191,36,0.3);
      color: var(--amber-400);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .page-hero-title {
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 700;
      color: var(--off-white);
      line-height: 1.3;
      letter-spacing: 0.02em;
      font-feature-settings: "palt";
      margin-bottom: 16px;
    }
    .page-hero-title .accent { color: var(--amber-400); }
    .page-hero-desc { font-size: 1rem; color: rgba(251,250,246,0.7); line-height: 1.75; }

    /* ─── Post List ─── */
    .blog-page { background: var(--white); padding: 64px 24px 80px; }
    .blog-page-inner { max-width: 800px; margin: 0 auto; }

    .post-list { display: flex; flex-direction: column; gap: 16px; }
    .post-card {
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .post-card:hover { border-color: var(--amber-400); box-shadow: 0 4px 16px rgba(19,32,51,0.06); }

    .post-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .post-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--amber-500);
      background: rgba(251,191,36,0.12);
      border: 1px solid rgba(245,158,11,0.25);
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .post-title { font-size: 1.15rem; font-weight: 700; color: var(--text-dark); line-height: 1.5; margin-bottom: 8px; }
    .post-desc { font-size: 0.95rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 12px; }
    .post-date { font-size: 12px; color: var(--text-muted); }

    .blog-empty { text-align: center; color: var(--text-muted); padding: 40px 0; }

    /* ─── Footer ─── */
    .footer { background: var(--navy-900); padding: 2rem 1.5rem; }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }
    .footer-brand-name { font-size: 16px; font-weight: 600; color: var(--off-white); margin-bottom: 4px; }
    .footer-brand-sub { font-size: 12px; color: rgba(251,250,246,0.5); line-height: 1.5; }
    .footer-brand-tagline { font-style: italic; }
    .footer-links { display: flex; flex-direction: row; align-items: center; gap: 2rem; flex-wrap: wrap; }
    .footer-link { font-size: 13px; color: var(--off-white); text-decoration: none; opacity: 0.8; transition: opacity 0.15s; }
    .footer-link:hover { opacity: 1; }
    .footer-copy { font-size: 12px; color: rgba(251,250,246,0.4); text-align: right; }

    @media (max-width: 768px) {
      .blog-page { padding: 48px 16px 64px; }
      .footer-inner { grid-template-columns: 1fr; text-align: center; }
      .footer-links { justify-content: center; }
      .footer-copy { text-align: center; }
    }
